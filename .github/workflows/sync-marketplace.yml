name: Sync Trading Skills to Marketplace

on:
  pull_request:
    paths:
      - "skills/**"
      - "scripts/sync-marketplace.py"
      - "requirements-sync.txt"
      - ".github/workflows/sync-marketplace.yml"
  push:
    branches: [main]
    paths:
      - "skills/**"
      - "scripts/sync-marketplace.py"
      - "requirements-sync.txt"
      - ".github/workflows/sync-marketplace.yml"
  workflow_dispatch:
    inputs:
      dry_run_only:
        description: Validate the production sync without applying changes
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  validate:
    name: Validate catalogue
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-sync.txt

      - run: python -m pip install --requirement requirements-sync.txt

      - name: Validate every skill and asset
        run: python scripts/sync-marketplace.py --validate-only

      - name: Run sync-client regression tests
        run: python -m unittest discover -s tests -p "test_*.py" -v

  sync:
    name: Sync production marketplace
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: marketplace-sync-production
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-sync.txt

      - run: python -m pip install --requirement requirements-sync.txt

      - name: Plan and synchronize catalogue
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          MARKETPLACE_AUTHOR_ID: ${{ secrets.MARKETPLACE_AUTHOR_ID }}
        run: |
          if [ "${{ inputs.dry_run_only || false }}" = "true" ]; then
            python scripts/sync-marketplace.py --dry-run-only
          else
            python scripts/sync-marketplace.py
          fi
