name: Sync Trading Skills to Marketplace

on:
  push:
    branches: [main]
    paths: ["skills/**"]

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pyyaml requests

      - name: Sync skills to marketplace
        env:
          BASEMENT_API_URL: ${{ secrets.BASEMENT_API_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          AUTHOR_ID: ${{ secrets.MARKETPLACE_AUTHOR_ID }}
        run: python scripts/sync-marketplace.py
